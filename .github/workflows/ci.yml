name: Laravel CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: school_result_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: school_result_test
      DB_USERNAME: root
      DB_PASSWORD: password
      CACHE_STORE: file
      SESSION_DRIVER: database
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, zip, intl, xml, dom, simplexml
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist
      - name: PHP syntax check
        run: find app bootstrap config database public routes resources -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run grading and Excel smoke tests
        run: php tests/smoke.php
      - name: Run MySQL migrations and seed admin
        run: php artisan migrate:fresh --seed --force
      - run: php artisan route:list
      - name: Build production Docker image
        run: docker build --pull -t school-result-laravel .
